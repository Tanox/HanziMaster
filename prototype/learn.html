<!DOCTYPE html>
<!--
  prototype/learn.html · 学习页高保真交互原型 · v5.2.27
  探索「学习 / 每日练习」界面的完整交互：汉字网格、筛选、详情弹窗（笔顺/词语/字义）。
  Design Token 与 globals.css @theme / 07-design-prototype.md 保持一致（东方水墨·朱砂红）。
  仅用于设计探索，不导入生产代码。
-->
<html lang="zh-CN" class="">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
<title>HanziMaster · 学习页原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Noto+Serif+SC:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles/learn-part1.css" />
</head>
<body>
<a href="#main-content" class="skip-link" style="position:absolute;top:-100%;left:16px;z-index:200;padding:12px 20px;background:var(--primary);color:#fff;border-radius:8px;text-decoration:none;font-weight:600;">跳到主内容</a>

<header class="topbar" id="page-header">
  <div class="brand"><span class="mark">汉</span> HanziMaster</div>
  <nav class="mainnav" id="main-nav">
    <a class="navlink" href="prototype.html">首页</a>
    <a class="navlink is-active" href="learn.html">学习</a>
    <a class="navlink" href="practice.html">练习</a>
    <a class="navlink" href="progress.html">进度</a>
  </nav>
  <span class="spacer"></span>
  <button class="icon-btn" id="theme-toggle" aria-label="切换深色模式" title="切换深色模式">🌓</button>
  <button class="icon-btn" aria-label="设置">⚙</button>
</header>

<main id="main-content">
  <div class="page-head" id="learn-page-head">
    <span class="eyebrow">每日练习</span>
    <h1 class="display-font">选择一个汉字</h1>
    <p>探索其笔顺、词语与字义，点击卡片查看详情。</p>
  </div>

  <div class="filters" id="learn-filters">
    <div class="search">
      <span class="si">🔍</span>
      <input id="character-search" placeholder="搜索拼音 / 汉字 / 部首…" aria-label="搜索汉字" />
    </div>
    <button class="chip is-active" data-filter="all">全部</button>
    <button class="chip" data-filter="new">新词</button>
    <button class="chip" data-filter="learning">复习中</button>
    <button class="chip" data-filter="mastered">已掌握</button>
  </div>

  <div class="grid" id="hanzi-grid"></div>
</main>

<!-- 详情弹窗 -->
<div class="overlay" id="detail-overlay" role="dialog" aria-modal="true" aria-labelledby="detail-title">
  <div class="dialog" id="learn-detail-dialog">
    <div class="dialog-head">
      <div class="big-glyph serif-font" id="detail-glyph">木</div>
      <div>
        <h2 id="detail-title" class="display-font">木</h2>
        <div class="meta" id="detail-meta">mù · Wood · 4 画 · 部首 木</div>
      </div>
      <button class="icon-btn close" id="detail-close" aria-label="关闭">✕</button>
    </div>
    <div class="tabs">
      <button class="tab is-active" data-tab="stroke">笔顺</button>
      <button class="tab" data-tab="words">词语</button>
      <button class="tab" data-tab="meaning">字义</button>
    </div>
    <div class="tab-panel is-active" id="tab-stroke">
      <div class="stroke-demo">
        <div class="glyph serif-font" id="stroke-glyph">木</div>
        <ol id="stroke-list"></ol>
      </div>
    </div>
    <div class="tab-panel" id="tab-words">
      <div class="word-list" id="word-list"></div>
    </div>
    <div class="tab-panel" id="tab-meaning">
      <div class="example" id="example-box"></div>
    </div>
    <div style="display:flex;gap:12px;margin-top:24px;">
      <button class="btn btn-primary" id="mark-learned">标记为已掌握</button>
      <button class="btn btn-outline" id="practice-link">去练习</button>
    </div>
  </div>
</div>

<div class="toast" id="learn-toast"><span class="dot"></span><div><b id="toast-title">已掌握</b><span id="toast-message">木 已加入已掌握列表</span></div></div>

<script src="scripts/learn-part1.js"></script>
</body>
</html>
