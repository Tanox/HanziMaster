<style>

  .display-font { font-family:var(--font-display); }

  /* Header */

  nav.mainnav { display:flex; gap:4px; margin-left:8px; }

  .filters { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:28px; }
  .search { position:relative; flex:1; min-width:220px; }
  .search input { width:100%; font-family:var(--font-sans); font-size:14px; padding:12px 14px 12px 42px; border:2px solid var(--border); border-radius:var(--radius-md); background:var(--card); color:var(--foreground); transition:border-color var(--dur-fast),box-shadow var(--dur-fast); }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:16px; }
  .hz-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:20px; text-align:center; cursor:pointer; box-shadow:var(--shadow-ink); transition:transform var(--dur-normal) var(--ease-out),box-shadow var(--dur-normal) var(--ease-out),border-color var(--dur-normal); }
  .hz-card:hover { transform:translateY(-8px); box-shadow:var(--shadow-ink-lg); border-color:color-mix(in srgb,var(--primary) 40%,var(--border)); }
  .hz-card .glyph { font-family:var(--font-serif); font-size:56px; font-weight:500; line-height:1.1; color:var(--foreground); }
  .hz-card .py { font-family:var(--font-mono); font-size:13px; color:var(--accent); margin-top:8px; }
  .hz-card .en { font-size:12px; color:var(--muted-foreground); margin-top:2px; }
  .hz-card .badge { margin-top:10px; }

  .badge { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:3px 10px; border-radius:999px; }
  .badge-mastered { background:rgba(52,199,89,0.15); color:#1a7a37; }
  .badge-learning { background:rgba(245,158,11,0.15); color:#9a6200; }
  .badge-new { background:rgba(59,130,246,0.15); color:#1d4ed8; }
  .dark .badge-mastered { color:#7ee2a0; } .dark .badge-learning { color:#fcd34d; } .dark .badge-new { color:#93c5fd; }

  /* Dialog */
  .overlay { position:fixed; inset:0; background:var(--scrim); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; z-index:100; padding:20px; opacity:0; transition:opacity var(--dur-normal) var(--ease-smooth); }
  .overlay.open { display:flex; opacity:1; }
  .dialog { background:color-mix(in srgb,var(--card) 95%,transparent); backdrop-filter:blur(20px); border-radius:var(--radius-3xl); box-shadow:var(--shadow-ink-xl); width:min(560px,100%); max-height:90vh; overflow:auto; padding:32px; transform:scale(0.94); transition:transform var(--dur-normal) var(--ease-spring); }
  .overlay.open .dialog { transform:scale(1); }
  .dialog-head { display:flex; align-items:center; gap:18px; margin-bottom:20px; }
  .dialog-head .big-glyph { font-family:var(--font-serif); font-size:72px; font-weight:500; width:110px; height:110px; border-radius:var(--radius-xl); background:var(--muted); display:flex; align-items:center; justify-content:center; }
  .dialog-head h2 { font-family:var(--font-display); font-size:26px; }

  .tabs { display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:18px; }
  .tab { padding:10px 16px; font-size:14px; font-weight:500; color:var(--muted-foreground); background:transparent; border:none; border-bottom:2px solid transparent; cursor:pointer; transition:color var(--dur-fast),border-color var(--dur-fast); }
  .tab.is-active { color:var(--primary); border-bottom-color:var(--primary); }
  .tab-panel { display:none; animation:fadeIn var(--dur-normal) var(--ease-out); }
  .tab-panel.is-active { display:block; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }
  .stroke-demo { display:flex; align-items:center; gap:20px; padding:20px; background:var(--muted); border-radius:var(--radius-lg); }
  .stroke-demo .glyph { font-family:var(--font-serif); font-size:90px; font-weight:500; }
  .stroke-demo ol { font-size:14px; color:var(--foreground); }
  .stroke-demo ol li { margin:4px 0; }
  .word-list { display:flex; flex-direction:column; gap:10px; }
  .word-item { display:flex; align-items:center; gap:12px; padding:12px 14px; background:var(--muted); border-radius:var(--radius-md); }
  .word-item .w { font-family:var(--font-serif); font-size:18px; font-weight:500; }
  .word-item .p { font-family:var(--font-mono); font-size:13px; color:var(--accent); }
  .word-item .e { color:var(--muted-foreground); font-size:13px; margin-left:auto; }
  .example { padding:16px; background:var(--muted); border-radius:var(--radius-lg); font-family:var(--font-serif); font-size:16px; }
  .example .py { font-family:var(--font-mono); font-size:13px; color:var(--accent); margin-top:6px; }
  .example .en { color:var(--muted-foreground); font-size:13px; }

  /* Toast */
  .toast { position:fixed; top:80px; right:16px; z-index:200; display:flex; align-items:center; gap:12px; min-width:280px; padding:14px 16px; border-radius:var(--radius-md); box-shadow:var(--shadow-ink-lg); background:var(--card); border:1px solid var(--border); transform:translateX(120%); transition:transform var(--dur-normal) var(--ease-out); }
  .toast.show { transform:translateX(0); }
  .toast .dot { width:10px; height:10px; border-radius:999px; background:var(--success); }

  .btn { display:inline-flex; align-items:center; gap:8px; font-family:var(--font-sans); font-weight:600; font-size:14px; padding:12px 20px; border-radius:var(--radius-md); border:1px solid transparent; cursor:pointer; transition:transform var(--dur-fast) var(--ease-spring),box-shadow var(--dur-normal); }
  .btn-primary { background:var(--primary); color:var(--primary-foreground); }
  .btn-primary:hover { background:var(--primary-dark); transform:translateY(-2px); box-shadow:var(--shadow-glow); }
  .btn-outline { background:transparent; color:var(--foreground); border-color:var(--border); }
  .btn-outline:hover { border-color:var(--primary); color:var(--primary); }

  *:focus-visible { outline:2px solid var(--ring); outline-offset:2px; border-radius:4px; }
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important;}}
  @media (max-width:640px){ main{padding:28px 16px 60px;} .page-head h1{font-size:26px;} nav.mainnav{display:none;} }
</style>

      example:{s:'小心火！',p:'Xiǎoxīn huǒ!',e:'Be careful with fire!'} },
    { hanzi:'木', py:'mù', en:'Wood / Tree', strokes:4, radical:'木', status:'mastered',
      words:[{w:'木头',p:'mùtou',e:'Wood'},{w:'树木',p:'shùmù',e:'Trees'},{w:'木马',p:'mùmǎ',e:'Hobby horse'}],
      example:{s:'这是一棵大树。',p:'Zhè shì yī kē dà shù.',e:'This is a big tree.'} },
  ];
  const statusMap = { mastered:{cls:'badge-mastered',label:'已掌握'}, learning:{cls:'badge-learning',label:'复习中'}, new:{cls:'badge-new',label:'新词'} };

  const grid = document.getElementById('hanziGrid');
  function render(list){
    grid.innerHTML = '';
    list.forEach(c=>{
      const s = statusMap[c.status];
      const el = document.createElement('button');
      el.className = 'hz-card';
      el.setAttribute('aria-label', `${c.hanzi} ${c.py}`);
      el.innerHTML = `<div class="glyph serif-font">${c.hanzi}</div><div class="py">${c.py}</div><div class="en">${c.en}</div><span class="badge ${s.cls}">${s.label}</span>`;
      el.onclick = ()=>openDialog(c);
      grid.appendChild(el);
    });
  }
  render(chars);

  // 筛选 + 搜索
  let curFilter='all';
  document.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{
    document.querySelectorAll('.chip').forEach(x=>x.classList.remove('is-active'));
    ch.classList.add('is-active'); curFilter=ch.dataset.filter; applyFilter();
  });
  document.getElementById('searchInput').oninput = applyFilter;
  function applyFilter(){
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    const list = chars.filter(c=>{
      const okF = curFilter==='all' || c.status===curFilter;
      const okQ = !q || c.hanzi.includes(q) || c.py.toLowerCase().includes(q) || c.en.toLowerCase().includes(q);
      return okF && okQ;
    });
    render(list);
  }

  // 弹窗
  const overlay=document.getElementById('overlay');
  function openDialog(c){
    document.getElementById('dlgGlyph').textContent=c.hanzi;
    document.getElementById('dlgTitle').textContent=c.hanzi;
    document.getElementById('dlgMeta').textContent=`${c.py} · ${c.en} · ${c.strokes} 画 · 部首 ${c.radical}`;
    document.getElementById('strokeGlyph').textContent=c.hanzi;
    const sl=document.getElementById('strokeList'); sl.innerHTML='';
    for(let i=1;i<=c.strokes;i++){const li=document.createElement('li');li.textContent=`第 ${i} 笔`;sl.appendChild(li);}
    const wl=document.getElementById('wordList'); wl.innerHTML='';
    c.words.forEach(w=>{const d=document.createElement('div');d.className='word-item';d.innerHTML=`<span class="w">${w.w}</span><span class="p">${w.p}</span><span class="e">${w.e}</span>`;wl.appendChild(d);});
    document.getElementById('exampleBox').innerHTML=`${c.example.s}<div class="py">${c.example.p}</div><div class="en">${c.example.e}</div>`;
    overlay.classList.add('open');
  }
  function closeDialog(){overlay.classList.remove('open');}
  document.getElementById('dlgClose').onclick=closeDialog;
  overlay.onclick=(e)=>{if(e.target===overlay)closeDialog();};
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDialog();});
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('is-active'));
    document.querySelectorAll('.tab-panel').forEach(x=>x.classList.remove('is-active'));
    t.classList.add('is-active'); document.getElementById('tab-'+t.dataset.tab).classList.add('is-active');
  });
  document.getElementById('markLearned').onclick=()=>{ showToast('已掌握', document.getElementById('dlgTitle').textContent+' 已加入已掌握列表'); };
  document.getElementById('practiceBtn').onclick=()=>{ closeDialog(); window.location.href='practice.html'; };

  // Toast
  const toast=document.getElementById('toast'); let toastTimer;
  function showToast(title,msg){ document.getElementById('toastTitle').textContent=title; document.getElementById('toastMsg').textContent=msg; toast.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>toast.classList.remove('show'),3000); }

  // 主题切换
  const tgl=document.getElementById('themeToggle');
  tgl.onclick=()=>{ const d=document.documentElement.classList.toggle('dark'); localStorage.setItem('hm-theme',d?'dark':'light'); };
  if(localStorage.getItem('hm-theme')==='dark') document.documentElement.classList.add('dark');
</script>
</body>
</html>
