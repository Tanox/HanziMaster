<html lang="zh-CN" class="">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
<title>汉字学习卡 — 变体原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<body>
  <div class="stage-wrap" id="character-detail-main">

      <h1>每日研习</h1>
      <p>选择一个汉字，研读其音、形、义与用法。</p>

    <div id="variant-stage" class="stage" aria-live="polite"></div>

  <nav class="proto-picker" id="variant-picker" data-position="top" aria-label="Prototype variants">

    <button class="proto-picker-item" data-active aria-current="true">水墨卷轴</button>
    <button class="proto-picker-item">教学卡</button>
    <button class="proto-picker-item">沉浸工作台</button>
    <span class="proto-picker-divider" aria-hidden="true"></span>
    <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>

<script src="scripts/character-detail-part1.js"></script>
