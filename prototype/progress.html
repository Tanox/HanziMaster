<!DOCTYPE html>
<!--
  prototype/progress.html · 进度/统计页高保真交互原型 · v5.2.27
  探索「学习进度」仪表盘：统计卡、周练习热力图、连续天数、分类掌握度。
  Design Token 与 globals.css @theme / 07-design-prototype.md 保持一致（东方水墨·朱砂红）。
  仅用于设计探索，不导入生产代码。
-->
<html lang="zh-CN" class="">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
<title>HanziMaster · 进度页原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Noto+Serif+SC:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles/progress-part1.css" />
</head>
<body>
<header class="topbar" id="page-header">
  <div class="brand"><span class="mark">汉</span> HanziMaster</div>
  <nav class="mainnav" id="main-nav">
    <a class="navlink" href="prototype.html">首页</a>
    <a class="navlink" href="learn.html">学习</a>
    <a class="navlink" href="practice.html">练习</a>
    <a class="navlink is-active" href="progress.html">进度</a>
  </nav>
  <span class="spacer"></span>
  <button class="icon-btn" id="theme-toggle" aria-label="切换深色模式" title="切换深色模式">🌓</button>
  <button class="icon-btn" aria-label="设置">⚙</button>
</header>

<main id="main-content">
  <div class="page-head" id="progress-page-head">
    <span class="eyebrow">学习进度</span>
    <h1 class="display-font">你的水墨旅程</h1>
  </div>

  <div class="stats" id="progress-stats">
    <div class="stat stat--vermilion"><div class="num">128</div><div class="lab">已学汉字</div><div class="sub">↑ 本周 +12</div></div>
    <div class="stat stat--indigo"><div class="num">23</div><div class="lab">连续天数</div><div class="sub">🔥 保持中</div></div>
    <div class="stat stat--success"><div class="num">94%</div><div class="lab">测验正确率</div><div class="sub">↑ 2%</div></div>
    <div class="stat stat--warning"><div class="num">7</div><div class="lab">待复习</div><div class="sub">今天到期</div></div>
  </div>

  <div class="grid-2" id="progress-breakdown">
    <div class="card">
      <h3>近 5 周练习热力图</h3>
      <div class="heat" id="activity-heatmap"></div>
      <div class="heat-legend"><span>少</span><span class="cell"></span><span class="cell l1"></span><span class="cell l2"></span><span class="cell l3"></span><span class="cell l4"></span><span>多</span></div>
    </div>
    <div class="card">
      <h3>分类掌握度</h3>
      <div class="mastery">
        <div class="m-row"><span class="m-name">自然</span><div class="m-track"><div class="m-fill" style="width:82%"></div></div><span class="m-pct">82%</span></div>
        <div class="m-row"><span class="m-name">数字</span><div class="m-track"><div class="m-fill" style="width:95%"></div></div><span class="m-pct">95%</span></div>
        <div class="m-row"><span class="m-name">人体</span><div class="m-track"><div class="m-fill" style="width:68%"></div></div><span class="m-pct">68%</span></div>
        <div class="m-row"><span class="m-name">动作</span><div class="m-track"><div class="m-fill" style="width:54%"></div></div><span class="m-pct">54%</span></div>
        <div class="m-row"><span class="m-name">方位</span><div class="m-track"><div class="m-fill" style="width:73%"></div></div><span class="m-pct">73%</span></div>
      </div>
    </div>
  </div>

  <div class="card" id="recent-activity-card">
    <h3>最近活动</h3>
    <div class="activity">
      <div class="act"><span class="ico">✍️</span><div><div class="a-t">书写练习 · 水</div><div class="a-d">4 笔全部描红成功</div></div><span class="a-time">10 分钟前</span></div>
      <div class="act"><span class="ico">📝</span><div><div class="a-t">测验 · 自然类</div><div class="a-d">正确率 100%（5/5）</div></div><span class="a-time">1 小时前</span></div>
      <div class="act"><span class="ico">🎯</span><div><div class="a-t">掌握新字 · 火</div><div class="a-d">已加入已掌握列表</div></div><span class="a-time">昨天</span></div>
      <div class="act"><span class="ico">🔥</span><div><div class="a-t">连续学习 23 天</div><div class="a-d">打破上一纪录</div></div><span class="a-time">昨天</span></div>
    </div>
  </div>
</main>

<script src="scripts/progress-part1.js"></script>
</body>
</html>
