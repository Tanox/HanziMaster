<!DOCTYPE html>
<!--
  prototype/practice.html · 练习页高保真交互原型 · v5.2.27
  探索「测验 / 书写练习」界面：选择题、书写轨迹占位、即时反馈与进度条。
  Design Token 与 globals.css @theme / 07-design-prototype.md 保持一致（东方水墨·朱砂红）。
  仅用于设计探索，不导入生产代码。
-->
<html lang="zh-CN" class="">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
<title>HanziMaster · 练习页原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Noto+Serif+SC:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles/practice-part1.css" />
</head>
<body>
<header class="topbar" id="page-header">
  <div class="brand"><span class="mark">汉</span> HanziMaster</div>
  <nav class="mainnav" id="main-nav">
    <a class="navlink" href="prototype.html">首页</a>
    <a class="navlink" href="learn.html">学习</a>
    <a class="navlink is-active" href="practice.html">练习</a>
    <a class="navlink" href="progress.html">进度</a>
  </nav>
  <span class="spacer"></span>
  <button class="icon-btn" id="theme-toggle" aria-label="切换深色模式" title="切换深色模式">🌓</button>
  <button class="icon-btn" aria-label="设置">⚙</button>
</header>

<main id="main-content">
  <div class="page-head" id="practice-page-head">
    <span class="eyebrow">练习</span>
    <h1 class="display-font">巩固所学</h1>
  </div>

  <div class="progress-wrap" id="practice-progress">
    <div class="progress-meta"><span id="progress-label">第 1 / 5 题</span><span id="progress-percent">20%</span></div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:20%"></div></div>
  </div>

  <div class="modes" id="practice-modes">
    <div class="mode is-active" data-mode="quiz"><div class="mi">📝</div><div class="mt">选择题</div></div>
    <div class="mode" data-mode="write"><div class="mi">✍️</div><div class="mt">书写练习</div></div>
  </div>

  <!-- 测验 -->
  <div id="quiz-panel">
    <div class="quiz" id="quiz-card">
      <div class="q-glyph serif-font" id="quiz-glyph">木</div>
      <div class="q-ask">这个汉字的拼音是？</div>
      <div class="options" id="quiz-options"></div>
      <div class="quiz-feedback" id="quiz-feedback"></div>
      <div class="quiz-actions">
        <button class="btn btn-primary" id="quiz-next" disabled>下一题 →</button>
      </div>
    </div>
  </div>

  <!-- 书写 -->
  <div id="writing-panel" class="write-panel">
    <div class="quiz" id="writing-card">
      <div class="canvas-wrap">
        <div class="write-target serif-font" id="writing-target">水</div>
      </div>
      <div class="write-hint">按笔顺描红，共 <span id="writing-stroke-count">4</span> 笔</div>
      <div class="stroke-steps" id="writing-steps"></div>
      <div class="quiz-actions">
        <button class="btn btn-primary" id="writing-next">下一个字 →</button>
      </div>
    </div>
  </div>
</main>

<script src="scripts/practice-part1.js"></script>
</body>
</html>
