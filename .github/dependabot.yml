version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      production:
        patterns: ['next', 'react', 'react-dom', '@radix-ui/*', 'lucide-react']
      dev-tooling:
        patterns: ['@types/*', 'eslint*', 'typescript', 'vitest', 'prettier', '@playwright/*']
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    labels: [ci]
